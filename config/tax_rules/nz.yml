name: New Zealand
currency: NZD
components:
  - type: progressive
    # Each band covers income above the previous `up_to`, up to and including its own. Last band has no `up_to`.
    bands:
      - { up_to: 15600, rate: "0.105" }
      - { up_to: 53500, rate: "0.175" }
      - { up_to: 78100, rate: "0.30" }
      - { up_to: 180000, rate: "0.33" }
      - { up_to: ~, rate: "0.39" }
